# Vérifie chaque proposition de modification, puis publie le site sur GitHub Pages
# à chaque mise à jour de la branche main.
# Prérequis unique : Settings > Pages > Build and deployment > Source : « GitHub Actions ».
name: Vérification et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; un déploiement en cours n'est pas interrompu.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # Le site est servi sous https://<compte>.github.io/<dépôt>/ : la base suit le nom du dépôt.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deployer:
    name: Publication sur GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
