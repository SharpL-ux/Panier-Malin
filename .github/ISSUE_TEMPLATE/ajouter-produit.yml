name: Ajouter un produit
description: Proposer un produit courant qui manque au catalogue.
title: '[Produit] '
labels: ['catalogue']
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Le catalogue réunit des produits courants, vendus dans plusieurs magasins.
        Pour un produit que vous êtes seul à acheter, le bouton « Ajouter un produit » de l'application suffit : il reste sur votre appareil.
  - type: input
    id: nom
    attributes:
      label: Nom du produit
      placeholder: Lait demi-écrémé UHT
    validations:
      required: true
  - type: input
    id: marque
    attributes:
      label: Marque
      description: Laissez vide pour un produit vendu en vrac ou sans marque.
      placeholder: Lactel
  - type: input
    id: format
    attributes:
      label: Format
      placeholder: 6 × 1 L, 500 g, 12 pièces…
    validations:
      required: true
  - type: dropdown
    id: rayon
    attributes:
      label: Rayon
      options:
        - Fruits
        - Légumes
        - Boulangerie & Viennoiserie
        - Boucherie
        - Volaille
        - Poissonnerie
        - Charcuterie & Traiteur
        - Crèmerie
        - Fromages
        - Yaourts & Desserts frais
        - Petit-déjeuner
        - Café & Thé
        - Épicerie salée
        - Épicerie sucrée
        - Produits du monde
        - Halal
        - Boissons
        - Alcools
        - Bébé
        - Hygiène & Beauté
        - Entretien & Ménage
        - Papeterie & Maison
        - Animaux
        - Surgelés
    validations:
      required: true
  - type: dropdown
    id: enseignes
    attributes:
      label: Où le trouve-t-on ?
      description: Une marque de distributeur n'est vendue que dans son enseigne.
      multiple: true
      options:
        - Partout (marque nationale ou vrac)
        - Carrefour
        - Lidl
        - E.Leclerc
        - H Market
        - Marka Market
    validations:
      required: true
  - type: input
    id: code-barres
    attributes:
      label: Code-barres (EAN)
      description: Recopiez-le depuis l'emballage ou la fiche Open Food Facts. Laissez vide en cas de doute, un code-barres faux est pire qu'un code-barres absent.
      placeholder: 13 chiffres
  - type: input
    id: lien-off
    attributes:
      label: Lien vers la fiche Open Food Facts
      placeholder: https://world.openfoodfacts.org/product/…
  - type: input
    id: equivalent
    attributes:
      label: Produits équivalents déjà présents
      description: Avec quels produits du catalogue peut-on comparer son prix ?
      placeholder: Les autres laits demi-écrémés UHT
  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications
      options:
        - label: Les informations viennent de l'emballage ou d'Open Food Facts, pas du site d'une enseigne.
          required: true
