name: Ajouter un produit
description: Proposer un produit courant qui manque au catalogue.
title: '[Produit] '
labels: ['catalogue']
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Le catalogue réunit des produits courants et halal, vendus dans plusieurs magasins : une fiche par produit, sans marque imposée.
        Pour un produit que vous êtes seul à acheter, le bouton « Ajouter un produit » de l'application suffit : il reste sur votre appareil.
  - type: input
    id: nom
    attributes:
      label: Nom du produit
      description: Sans marque, par exemple « Lait demi-écrémé UHT » plutôt que « Lait Lactel ».
      placeholder: Lait demi-écrémé UHT
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Format
      placeholder: 6 × 1 L, 500 g, 12 pièces…
    validations:
      required: true
  - type: dropdown
    id: rayon
    attributes:
      label: Rayon
      options:
        - Fruits
        - Légumes
        - Boulangerie & Viennoiserie
        - Boucherie
        - Volaille
        - Poissonnerie
        - Charcuterie & Traiteur
        - Crèmerie
        - Fromages
        - Yaourts & Desserts frais
        - Petit-déjeuner
        - Café & Thé
        - Épicerie salée
        - Épicerie sucrée
        - Produits du monde
        - Boissons
        - Bébé
        - Hygiène & Beauté
        - Entretien & Ménage
        - Papeterie & Maison
        - Animaux
        - Surgelés
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Marque la moins chère dans chaque enseigne
      description: Une ligne par enseigne que vous connaissez. Laissez vide pour un produit vendu en vrac ou sans marque.
      placeholder: |
        Carrefour : Simpl
        Lidl : Milbona
        E.Leclerc : Eco+
  - type: input
    id: code-barres
    attributes:
      label: Code-barres (EAN) de la référence la moins chère
      description: Recopiez-le depuis l'emballage ou la fiche Open Food Facts. Laissez vide en cas de doute, un code-barres faux est pire qu'un code-barres absent.
      placeholder: 13 chiffres
  - type: input
    id: lien-off
    attributes:
      label: Lien vers la fiche Open Food Facts
      placeholder: https://world.openfoodfacts.org/product/…
  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications
      options:
        - label: Les informations viennent de l'emballage ou d'Open Food Facts, pas du site d'une enseigne.
          required: true
        - label: Le produit ne contient ni porc, ni alcool, ni gélatine de porc, et sa viande éventuelle est certifiée halal.
          required: true
